<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Web Starter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900 flex items-center justify-center p-4">
    <main class="w-full max-w-md">
      <section class="card bg-white rounded-2xl shadow-lg p-6 space-y-4">
        <h1 class="text-2xl font-bold text-center">Quick Task List</h1>
        <p class="text-center text-sm text-slate-500">
          A modern web starter: HTML5 + Tailwind CDN + vanilla JS.
        </p>
        <form id="task-form" class="flex gap-2">
          <input
            id="task-input"
            type="text"
            placeholder="Add a task..."
            autocomplete="off"
            class="flex-1 rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400"
          />
          <button
            type="submit"
            class="rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white hover:bg-indigo-700"
          >
            Add
          </button>
        </form>
        <ul id="task-list" class="space-y-2"></ul>
        <p id="task-count" class="text-center text-sm text-slate-500">0 tasks</p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
